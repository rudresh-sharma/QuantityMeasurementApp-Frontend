<section class="oauth-success">
  <div class="oauth-success__card" [class.oauth-success__card--error]="isError">
    <div *ngIf="!isError" class="oauth-success__spinner" aria-hidden="true"></div>
    <div *ngIf="isError" class="oauth-success__icon" aria-hidden="true">!</div>
    <h1>{{ heading }}</h1>
    <p>{{ statusMessage }}</p>
    <button *ngIf="isError" type="button" class="oauth-success__action" (click)="goToHome()">
      {{ actionLabel }}
    </button>
  </div>
</section>
